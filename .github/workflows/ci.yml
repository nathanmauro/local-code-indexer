name: CI

on:
  push:
    branches:
      - next
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: ruff check .

      - name: Verify package build artifacts
        run: python -m pytest tests/test_build_artifact.py -q
